name: CI

on:
  push:
  pull_request:

jobs:
  node-services:
    name: lint + typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [indexer, keeper, api, web]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  program:
    name: cargo check (program)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --workspace

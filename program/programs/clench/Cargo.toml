[package]
name = "clench"
version = "0.1.0"
description = "CLENCH — hold-to-earn launchpad program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "clench"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022", "associated_token"] }
spl-token-2022 = { version = "3.0.2", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0.2", features = ["no-entrypoint"] }
# Пин: blake3 (через solana-program) в новых версиях тянет digest 0.11 →
# ctutils → cmov с edition2024, который не парсит старый cargo (1.75) из
# bundled Solana BPF-тулчейна (`anchor build`). Держим более старый blake3.
digest = "=0.10.7"
blake3 = "=1.5.5"
zeroize = "=1.3.0"
zeroize_derive = "=1.3.3"
